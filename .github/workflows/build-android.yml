
name: Build BreakloAI Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f BreakloAI-Android-Web-Project.zip
          unzip -q BreakloAI-Android-Web-Project.zip -d extracted
          test -f extracted/BreakloAI-Project/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install, bundle and generate Android project
        working-directory: extracted/BreakloAI-Project
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: extracted/BreakloAI-Project/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BreakloAI-debug-apk
          path: extracted/BreakloAI-Project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
