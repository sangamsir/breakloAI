
name: Build BreakloAI Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q BreakloAI-Android-Web-Project-FIXED3.zip -d extracted

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: extracted/BreakloAI-Project
        run: npm install --no-audit --no-fund

      - name: Build web application
        working-directory: extracted/BreakloAI-Project
        run: npm run build

      - name: Generate Android project
        working-directory: extracted/BreakloAI-Project
        run: npx cap add android

      - name: Sync Android project
        working-directory: extracted/BreakloAI-Project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: extracted/BreakloAI-Project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BreakloAI-debug-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: extracted/BreakloAI-Project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
